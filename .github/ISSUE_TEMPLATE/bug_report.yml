name: Bug report
description: Something doesn't work as expected.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Security issues or ways to bypass the safety checks** (consent, age, moderation, watermarking):
        do NOT open a public issue. Follow [SECURITY.md](../blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error …
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How are you running OpenShoot?
      options:
        - pnpm dev (local)
        - Docker Compose
        - Vercel
        - Other self-hosted setup
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. v0.1.0 or a commit SHA
  - type: textarea
    id: providers
    attributes:
      label: Providers
      description: Output of `pnpm check-env` (it never prints secrets), or the providers you use.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Server logs, browser console errors or screenshots. Remove API keys, emails and personal photos.
      render: text
